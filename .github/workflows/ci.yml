name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ engine (CPU backend, Vulkan disabled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSTONEPOTATOES_BUILD_EDITOR=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Install (smoke)
        run: cmake --install build --prefix "$RUNNER_TEMP/sp-install"
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: StonePotatoes-linux-x64
          path: build/packages/StonePotatoes-*.tar.gz
          if-no-files-found: error

  cpp-windows:
    name: C++ engine (Windows MSVC, Vulkan disabled)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DSTONEPOTATOES_BUILD_EDITOR=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 600
      - name: Install and package
        run: |
          cmake --install build --config Release --prefix "$env:RUNNER_TEMP\sp-install"
          cpack --config build/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: StonePotatoes-windows-x64
          path: build/packages/StonePotatoes-*.zip
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build web3-agent JNI DLL (Vulkan OFF)
        run: |
          cmake -S web3-agent/src/main/cpp -B build-jni -A x64 -DSP_ENGINE_ENABLE_VULKAN=OFF
          cmake --build build-jni --config Release
          if (-not (Test-Path build-jni/bin/Release/stonepotatoes_engine.dll)) { throw "stonepotatoes_engine.dll not produced" }

  cpp-vulkan:
    name: C++ Vulkan backend (software device)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential libvulkan-dev mesa-vulkan-drivers glslc xvfb xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Configure
        run: >
          cmake -S . -B build-vulkan -DCMAKE_BUILD_TYPE=Release
          -DSTONEPOTATOES_BUILD_EXAMPLES=OFF
      - name: Build Vulkan backend
        run: cmake --build build-vulkan --target StonePotatoesVulkanTests StonePotatoesVulkanPresentationSmoke StonePotatoesVulkanComputeRendererDemo StonePotatoesEditor StonePotatoesEditorTests -j"$(nproc)"
      - name: Test Vulkan backend
        run: ctest --test-dir build-vulkan -R 'vulkan_(unit|compute_renderer_runtime|presentation_resize_runtime)|editor_(session_unit|runtime_smoke)' --output-on-failure --timeout 300

  coverage:
    name: C++ coverage (gcov/lcov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential lcov xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build, test, collect coverage
        run: ./tools/ci/coverage.sh
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/summary.txt ]; then
            { echo '### C++ coverage (src/)'; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-coverage-lcov
          path: |
            coverage/lcov.info
            coverage/summary.txt
            coverage/html
          if-no-files-found: warn

  web3-agent:
    name: web3-agent (Java 25, mvn test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web3-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web3-ide:
    name: web3-ide (Maven build + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install web3-agent to local Maven repo
        working-directory: web3-agent
        run: mvn -B install -DskipTests
      - name: Build web3-ide (all modules)
        working-directory: web3-ide
        run: mvn -B verify
