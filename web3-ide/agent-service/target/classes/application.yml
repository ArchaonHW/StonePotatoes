spring:
  application:
    name: agent-service
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8091
  address: 0.0.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

agent:
  http-url: http://127.0.0.1:8089  # web3-agent HTTP service
